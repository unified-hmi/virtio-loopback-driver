name: test
run-name: Build virtio-lo kernel driver
on:
  push:
  pull_request:

jobs:

  ubuntu-kernel-build:
    # Builds against every installed header set: the runner's own kernel and
    # the distro generic kernel (5.15 on 22.04, 6.8 on 24.04).
    name: Build against ${{ matrix.os }} kernel headers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic

      - name: Build against installed kernel headers
        shell: bash
        run: |
          set -euo pipefail
          headers_found=false

          for build_dir in /lib/modules/*/build; do
            if [[ ! -f "${build_dir}/Makefile" ]]; then
              continue
            fi

            headers_found=true
            kernel_release="$(basename "$(dirname "${build_dir}")")"
            echo "Building virtio-lo against Linux ${kernel_release}"
            make -C "${build_dir}" M="${GITHUB_WORKSPACE}" clean
            make -C "${build_dir}" M="${GITHUB_WORKSPACE}" modules
            echo "- Linux ${kernel_release}: built" >> "${GITHUB_STEP_SUMMARY}"
          done

          if [[ "${headers_found}" != true ]]; then
            echo "::error::No kernel headers were found"
            exit 1
          fi

  upstream-kernel-build:
    # LTS kernels used by Yocto releases (dunfell 5.4, kirkstone 5.10/5.15,
    # mickledore 6.1, scarthgap 6.6). 5.15 is covered by ubuntu-22.04.
    name: Build against upstream Linux ${{ matrix.kernel }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - 5.4.302
          - 5.10.273
          - 6.1.191
          - 6.6.161
    permissions:
      contents: read
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-11 libelf-dev libssl-dev

      - name: Download Linux ${{ matrix.kernel }} source
        run: |
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz" \
            -o "${RUNNER_TEMP}/linux.tar.xz"
          tar -xf "${RUNNER_TEMP}/linux.tar.xz" -C "${RUNNER_TEMP}"

      - name: Prepare Linux ${{ matrix.kernel }} headers
        run: |
          make -C "${RUNNER_TEMP}/linux-${KERNEL_VERSION}" CC=gcc-11 HOSTCC=gcc-11 defconfig
          make -C "${RUNNER_TEMP}/linux-${KERNEL_VERSION}" CC=gcc-11 HOSTCC=gcc-11 \
            -j"$(nproc)" modules_prepare

      - name: Build virtio-lo against Linux ${{ matrix.kernel }}
        # modules_prepare does not produce Module.symvers, so kernel symbols
        # cannot be resolved; keep modpost from treating that as an error.
        run: |
          make -C "${RUNNER_TEMP}/linux-${KERNEL_VERSION}" \
            CC=gcc-11 HOSTCC=gcc-11 KBUILD_MODPOST_WARN=1 \
            M="${GITHUB_WORKSPACE}" -j"$(nproc)" modules
          echo "- Linux ${KERNEL_VERSION} (upstream defconfig, gcc-11): built" \
            >> "${GITHUB_STEP_SUMMARY}"

  build:
    if: github.event_name == 'push'
    needs: [ubuntu-kernel-build, upstream-kernel-build]
    name: Build on ubuntu-22.04
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose environment variables
        run: |

          PACKAGE_NAME=virtio-lo

          if [[ ${{ github.ref }} == refs/tags/v* ]] ; then
                TAG=${{ github.ref_name }}
                PACKAGE_VERSION="${TAG:1}"
                RELEASE=true
          else
                SHORT_SHA=$(git rev-parse --short HEAD)
                PACKAGE_VERSION="0.${SHORT_SHA}"
                RELEASE=false
          fi

          echo "PACKAGE_NAME=${PACKAGE_NAME}"       >> $GITHUB_ENV
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
          echo "RELEASE=${RELEASE}"                 >> $GITHUB_ENV

      - name: Build in the source tree
        run: make -C "/lib/modules/$(uname -r)/build" M="$(pwd)" modules

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dkms debhelper

      - name: Create debian package
        run: |

          cat << EOF > "dkms.conf"
          PACKAGE_NAME=${PACKAGE_NAME}
          PACKAGE_VERSION=${PACKAGE_VERSION}
          DEST_MODULE_LOCATION[0]="/updates"
          EOF

          sudo mkdir -p "/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"
          sudo cp -r *.[hc] Kbuild dkms.conf "/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"

          sudo dkms add   -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1
          sudo dkms build -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1
          sudo dkms mkdeb -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1

          cp /var/lib/dkms/"${PACKAGE_NAME}"/"${PACKAGE_VERSION}"/deb/* .

      - name: Create development package
        run: |

          INSTALL="$(pwd)/install"
          mkdir -p "${INSTALL}/DEBIAN"

          cat <<EOF > "${INSTALL}/DEBIAN/control"
          Package: ${PACKAGE_NAME}
          Version: ${PACKAGE_VERSION}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Aleksei Makarov <alm@opensynergy.com>
          Description: Development package for virtio-lo kernel driver
          EOF

          mkdir -p "${INSTALL}/usr/include/linux"
          cp virtio_lo.h "${INSTALL}/usr/include/linux"
          dpkg-deb --build "${INSTALL}" "${PACKAGE_NAME}-dev_${PACKAGE_VERSION}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: debian-packages
          path: "*.deb"

      - name: Create release
        if: env.RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          tag: v${{ env.PACKAGE_VERSION }}
          artifacts: "*.deb"
