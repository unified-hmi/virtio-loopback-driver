name: test
run-name: Build virtio-lo kernel driver
on:
  push:
  pull_request:

jobs:

  kernel-build:
    name: Build kernel module on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic

      - name: Build against installed kernel headers
        shell: bash
        run: |
          set -euo pipefail
          headers_found=false

          for build_dir in /lib/modules/*/build; do
            if [[ ! -f "${build_dir}/Makefile" ]]; then
              continue
            fi

            headers_found=true
            kernel_release="$(basename "$(dirname "${build_dir}")")"
            echo "Building virtio-lo against Linux ${kernel_release}"
            make -C "${build_dir}" M="${GITHUB_WORKSPACE}" clean
            make -C "${build_dir}" M="${GITHUB_WORKSPACE}" modules
          done

          if [[ "${headers_found}" != true ]]; then
            echo "::error::No kernel headers were found"
            exit 1
          fi

  kernel-5-10:
    name: Build against upstream Linux 5.10 headers
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-11 libelf-dev libssl-dev

      - name: Download Linux 5.10 source
        run: |
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.tar.xz \
            -o "${RUNNER_TEMP}/linux-5.10.tar.xz"
          tar -xf "${RUNNER_TEMP}/linux-5.10.tar.xz" -C "${RUNNER_TEMP}"

      - name: Prepare Linux 5.10 headers
        run: |
          make -C "${RUNNER_TEMP}/linux-5.10" CC=gcc-11 HOSTCC=gcc-11 defconfig
          make -C "${RUNNER_TEMP}/linux-5.10" CC=gcc-11 HOSTCC=gcc-11 \
            -j"$(nproc)" modules_prepare

      - name: Build virtio-lo against Linux 5.10
        run: |
          make -C "${RUNNER_TEMP}/linux-5.10" \
            CC=gcc-11 HOSTCC=gcc-11 M="${GITHUB_WORKSPACE}" \
            -j"$(nproc)" modules

  build:
    if: github.event_name == 'push'
    needs: [kernel-build, kernel-5-10]
    name: Build on ubuntu-22.04
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose environment variables
        run: |

          PACKAGE_NAME=virtio-lo

          if [[ ${{ github.ref }} == refs/tags/v* ]] ; then
                TAG=${{ github.ref_name }}
                PACKAGE_VERSION="${TAG:1}"
                RELEASE=true
          else
                SHORT_SHA=$(git rev-parse --short HEAD)
                PACKAGE_VERSION="0.${SHORT_SHA}"
                RELEASE=false
          fi

          echo "PACKAGE_NAME=${PACKAGE_NAME}"       >> $GITHUB_ENV
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
          echo "RELEASE=${RELEASE}"                 >> $GITHUB_ENV

      - name: Build in the source tree
        run: make -C "/lib/modules/$(uname -r)/build" M="$(pwd)" modules

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y dkms debhelper

      - name: Create debian package
        run: |

          cat << EOF > "dkms.conf"
          PACKAGE_NAME=${PACKAGE_NAME}
          PACKAGE_VERSION=${PACKAGE_VERSION}
          DEST_MODULE_LOCATION[0]="/updates"
          EOF

          sudo mkdir -p "/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"
          sudo cp -r *.[hc] Kbuild dkms.conf "/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}"

          sudo dkms add   -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1
          sudo dkms build -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1
          sudo dkms mkdeb -m "${PACKAGE_NAME}" -v "${PACKAGE_VERSION}" || exit 1

          cp /var/lib/dkms/"${PACKAGE_NAME}"/"${PACKAGE_VERSION}"/deb/* .

      - name: Create development package
        run: |

          INSTALL="$(pwd)/install"
          mkdir -p "${INSTALL}/DEBIAN"

          cat <<EOF > "${INSTALL}/DEBIAN/control"
          Package: ${PACKAGE_NAME}
          Version: ${PACKAGE_VERSION}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Aleksei Makarov <alm@opensynergy.com>
          Description: Development package for virtio-lo kernel driver
          EOF

          mkdir -p "${INSTALL}/usr/include/linux"
          cp virtio_lo.h "${INSTALL}/usr/include/linux"
          dpkg-deb --build "${INSTALL}" "${PACKAGE_NAME}-dev_${PACKAGE_VERSION}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: debian-packages
          path: "*.deb"

      - name: Create release
        if: env.RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          tag: v${{ env.PACKAGE_VERSION }}
          artifacts: "*.deb"
